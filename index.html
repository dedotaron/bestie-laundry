                        </div>

                        <div class="settings-field">
                            <label for="settingsFooter">📌 Footer</label>
                            <input type="text" id="settingsFooter" value="${escapeHtml(appSettings.footerText || '')}" placeholder="Contoh: © Bestie Laundry Since 2019">
                            <div class="hint">Teks di bagian bawah aplikasi</div>
                        </div>

                        <button id="saveSettingsBtn" class="btn-success">💾 SIMPAN PENGATURAN</button>
                        <button id="resetSettingsBtn" class="btn-warning">🔄 Reset ke Default</button>
                        <button class="secondary" id="backFromSettingsBtn">↩️ Kembali ke Utama</button>
                    </div>
                `;
        }

        function attachSettingsEvents() {
            const namaInput = document.getElementById("settingsNamaLaundry");
            const taglineInput = document.getElementById("settingsTagline");
            const footerInput = document.getElementById("settingsFooter");
            const previewTitle = document.getElementById("settingsPreviewTitle");
            const previewTagline = document.getElementById("settingsPreviewTagline");

            function updatePreview() {
                if (previewTitle) {
                    previewTitle.textContent = namaInput?.value || "BESTIE LAUNDRY";
                }
                if (previewTagline) {
                    previewTagline.textContent = taglineInput?.value || "✨ Manajemen Transaksi & Biaya ✨";
                }
            }

            namaInput?.addEventListener("input", updatePreview);
            taglineInput?.addEventListener("input", updatePreview);

            document.getElementById("saveSettingsBtn")?.addEventListener("click", function() {
                const nama = document.getElementById("settingsNamaLaundry").value.trim();
                const tagline = document.getElementById("settingsTagline").value.trim();
                const footer = document.getElementById("settingsFooter").value.trim();

                if (!nama) {
                    showToast("Nama Laundry tidak boleh kosong!", "error");
                    return;
                }

                appSettings.namaLaundry = nama || "BESTIE LAUNDRY";
                appSettings.tagline = tagline || "✨ Manajemen Transaksi & Biaya ✨";
                appSettings.footerText = footer || "© Bestie Laundry Since 2019";

                saveSettings();
                updateHeaderUI();
                showToast("✅ Pengaturan berhasil disimpan!", "success");
                navigateTo("utama");
            });

            document.getElementById("resetSettingsBtn")?.addEventListener("click", function() {
                if (confirm("Yakin ingin mereset pengaturan ke default?")) {
                    appSettings.namaLaundry = "BESTIE LAUNDRY";
                    appSettings.tagline = "✨ Manajemen Transaksi & Biaya ✨";
                    appSettings.footerText = "© Bestie Laundry Since 2019";
                    saveSettings();
                    updateHeaderUI();

                    document.getElementById("settingsNamaLaundry").value = appSettings.namaLaundry;
                    document.getElementById("settingsTagline").value = appSettings.tagline;
                    document.getElementById("settingsFooter").value = appSettings.footerText;
                    updatePreview();
                    showToast("✅ Pengaturan direset ke default!", "success");
                }
            });

            document.getElementById("backFromSettingsBtn")?.addEventListener("click", () => navigateTo("utama"));
        }

        // ============================================================
        // 28. RENDER MANAGE DATABASE
        // ============================================================
        function renderManageDatabase() {
            const totalTx = transactions.length;
            const totalBel = daftarBelanja.length;
            const statusText = (totalTx === 0 && totalBel === 0) ? '🔴 Kosong - Silakan Restore' : '🟡 Terisi Data';
            return `
                    <div class="panel">
                        <div class="panel-title">🗄️ MANAGE DATABASE</div>
                        <div class="warning-box">
                            <h3>⚠️ Perhatian!</h3>
                            <p>Jika database kosong, silakan restore dari file backup JSON.</p>
                        </div>
                        <div class="status-card">
                            <div class="status-row"><span class="label">📊 Total Transaksi</span><span class="value">${totalTx}</span></div>
                            <div class="status-row"><span class="label">🧾 Total Belanja</span><span class="value">${totalBel}</span></div>
                            <div class="status-row"><span class="label">📅 Status</span><span class="value">${statusText}</span></div>
                        </div>
                        
                        <!-- RESTORE DARI FILE -->
                        <div style="background: #e0f2fe; border-radius: 16px; padding: 16px; margin: 12px 0; border: 2px solid #38bdf8;">
                            <h4 style="color: #0369a1; margin-bottom: 8px;">📂 RESTORE DARI FILE BACKUP</h4>
                            <p style="font-size: 0.8rem; color: #075985; margin-bottom: 10px;">Pilih file backup JSON untuk memulihkan data</p>
                            <input type="file" id="restoreFileInput" accept=".json" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #bae6fd; background: white;">
                            <button id="restoreFromFileBtn" class="btn-success" style="margin-top: 8px;">📤 Restore dari File</button>
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn-danger" id="resetDbBtn">🗑️ Reset</button>
                            <button class="btn-excel" id="backupExcelBtn">📊 Backup Excel</button>
                        </div>
                        <div class="btn-group" style="margin-top:8px;">
                            <button class="btn-backup" id="backupJsonBtn">💾 Backup JSON</button>
                         <!--   <button class="secondary" id="restoreTxBtn">📋 Restore Transaksi</button>
                            <button class="secondary" id="restoreBelBtn">🧺 Restore Belanja</button> -->
                        </div>
                        <!-- <div class="small-note" style="margin-top:10px;">💡 Gunakan "Restore Uji" untuk mengembalikan data contoh.</div> -->
                        <button class="secondary" id="backFromManageBtn" style="margin-top:12px;">↩️ Kembali ke Utama</button>
                    </div>
                `;
        }

        function attachManageEvents() {
            // RESTORE DARI FILE
            document.getElementById("restoreFromFileBtn")?.addEventListener("click", function() {
                const fileInput = document.getElementById("restoreFileInput");
                const file = fileInput?.files?.[0];
                if (!file) {
                    showToast("❌ Silakan pilih file JSON terlebih dahulu!", "error");
                    return;
                }
                restoreDataFromFile(file);
            });

            // RESET ALL DATA
            document.getElementById("resetDbBtn")?.addEventListener("click", resetAllData);

            // RESTORE UJI (DUMMY)
            document.getElementById("restoreDbBtn")?.addEventListener("click", function() {
                if (!confirm("Anda akan mengembalikan data uji coba. Data saat ini akan DITIMPA. Lanjutkan?"))
                    return;
                initDummyData();
                showToast('✅ Data uji coba berhasil direstore!', 'success');
                renderApp();
            });

            // BACKUP EXCEL
            document.getElementById("backupExcelBtn")?.addEventListener("click", backupDataToExcel);

            // BACKUP JSON
            document.getElementById("backupJsonBtn")?.addEventListener("click", backupDataToJson);

            // RESTORE TRANSAKSI SAJA
            document.getElementById("restoreTxBtn")?.addEventListener("click", function() {
                if (!confirm("Restore data transaksi uji coba? (Data belanja tidak berubah)")) return;
                const today = new Date().toISOString().slice(0, 10);
                const tglSelesai1 = new Date();
                tglSelesai1.setDate(tglSelesai1.getDate() + 3);
                const tglSelesai2 = new Date();
                tglSelesai2.setDate(tglSelesai2.getDate() + 2);
                transactions = [{
                    id: "INV-001",
                    noNota: "6500",
                    nama: "DEDY KUSNINDAR",
                    tempoHari: 3,
                    tglOrder: today,
                    timeMasuk: "12:00:00",
                    tglSelesai: tglSelesai1.toISOString().slice(0, 10),
                    detailJasa: [
                        { namaJasa: "Cuci Setrika (CL)", kg: 3, hargaPerKg: 10000, total: 30000 },
                        { namaJasa: "Setrika Saja", kg: 3, hargaPerKg: 13333, total: 40000 },
                        { namaJasa: "Bed Cover (BC)", kg: 2, hargaPerKg: 12500, total: 25000 }
                    ],
                    totalHarga: 95000,
                    bayar: 95000,
                    sisa: 0,
                    status: "Lunas",
                    cashBank: "Cash",
                    keterangan: "Lunas"
                }, {
                    id: "INV-002",
                    noNota: "6501",
                    nama: "RINA WATI",
                    tempoHari: 2,
                    tglOrder: today,
                    timeMasuk: "14:30:00",
                    tglSelesai: tglSelesai2.toISOString().slice(0, 10),
                    detailJasa: [
                        { namaJasa: "Cuci Kiloan", kg: 5, hargaPerKg: 8000, total: 40000 },
                        { namaJasa: "Setrika Saja", kg: 2, hargaPerKg: 10000, total: 20000 }
                    ],
                    totalHarga: 60000,
                    bayar: 30000,
                    sisa: 30000,
                    status: "Belum Lunas",
                    cashBank: "Cash",
                    keterangan: "DP 30.000"
                }];
                saveData();
                showToast('✅ Transaksi berhasil direstore!', 'success');
                renderApp();
            });

            // RESTORE BELANJA SAJA
            document.getElementById("restoreBelBtn")?.addEventListener("click", function() {
                if (!confirm("Restore data belanja uji coba? (Data transaksi tidak berubah)")) return;
                const today = new Date().toISOString().slice(0, 10);
                daftarBelanja = [{
                    id: "belanja_1",
                    tgl_belanja: today,
                    sabun_cuci: 65000,
                    plastik: 10000,
                    parfum: 100000,
                    karbol: 10000,
                    listrik: 20000,
                    Gaz: 20000,
                    setrika: 20000,
                    lain_lain: 20000
                }];
                saveBelanja();
                showToast('✅ Belanja berhasil direstore!', 'success');
                renderApp();
            });

            document.getElementById("backFromManageBtn")?.addEventListener("click", () => navigateTo("utama"));
        }

        // ============================================================
        // 29. TAMBAHKAN: MINTA IZIN PENYIMPANAN PERSISTEN
        // ============================================================
        async function requestPersistentStorage() {
            try {
                if (navigator.storage && navigator.storage.persist) {
                    const granted = await navigator.storage.persist();
                    if (granted) {
                        console.log("✅ Data akan bertahan (persistent) - tidak dihapus sistem");
                    } else {
                        console.log("⚠️ Izin persistent ditolak oleh browser");
                    }
                } else {
                    console.log("ℹ️ Browser tidak mendukung Storage API");
                }
            } catch (e) {
                console.log("Error request persistent:", e);
            }
        }

        // ============================================================
        // 30. EKSPOS GLOBAL
        // ============================================================
        window.backupDataToExcel = backupDataToExcel;
        window.backupDataToJson = backupDataToJson;
        window.restoreDataFromFile = restoreDataFromFile;
        window.resetAllData = resetAllData;
        window.navigateTo = navigateTo;
        window.showToast = showToast;
        window.playPingSound = playPingSound;
        window.showLoading = showLoading;
        window.hideLoading = hideLoading;
        window.initDummyData = initDummyData;
        window.showModal = showModal;
        window.closeModal = closeModal;

        // ============================================================
        // 31. START APLIKASI
        // ============================================================
        (async function startApp() {
            await loadData();
            requestPersistentStorage();
            renderApp();
        })();
    </script>
