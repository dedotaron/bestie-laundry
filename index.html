        .search-section {

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 250px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.warning {
            background: #d97706;
        }

        /* ===== MODAL / MESSAGE BOX ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            60% {
                transform: scale(1.05);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }

        .modal-box {
            background: linear-gradient(145deg, #ffffff, #f0f4f8);
            border-radius: 30px;
            padding: 40px 35px;
            max-width: 460px;
            width: 92%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: bounceIn 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .modal-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #f59e0b, #e28a05, #ca5d19);
        }

        .modal-icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 12px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .modal-box h2 {

            margin-bottom: 20px;

        }

        .modal-box .message strong {

        .modal-divider {
            width: 60px;

            background: linear-gradient(90deg, #f59e0b, #ca5d19);
            margin: 12px auto 18px;

        .modal-actions {

    <script>
        // ============================================================
        // 1. FUNGSI SOUND PING
        // ============================================================
        function playPingSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

                function playBeep(frequency = 1046, duration = 120) {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.frequency.value = frequency;
                    oscillator.type = 'sine';
                    gainNode.gain.value = 0.95;
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + duration / 1000);
                }

                playBeep(1046, 130);
                setTimeout(() => {
                    playBeep(1046, 130);
                }, 150);
            } catch (e) {}
        }

        // ============================================================
        // 2. DATA STORE - PAKAI INDEXEDDB (localForage)
        // ============================================================
        let transactions = [];
        let daftarBelanja = [];

        let appSettings = {
            namaLaundry: "BESTIE LAUNDRY",
            tagline: "Manajemen Transaksi & Biaya",
            footerText: "© Bestie Laundry Since 2019"
        };

        // ============================================================
        // 3. FUNGSI DASAR
        // ============================================================
        function getCurrentMonth() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        }

        function getTodayDate() {
            return new Date().toISOString().slice(0, 10);
        }

        function getBelanjaThisMonth() {
            const currentMonth = getCurrentMonth();
            return daftarBelanja.filter(b => b.tgl_belanja && b.tgl_belanja.startsWith(currentMonth));
        }

        function getTotalBiayaBulanIni() {
            const belanjaBulanIni = getBelanjaThisMonth();
            let total = 0;
            for (const b of belanjaBulanIni) {
                total += (b.sabun_cuci || 0);
                total += (b.plastik || 0);
                total += (b.parfum || 0);
                total += (b.karbol || 0);
                total += (b.listrik || 0);
                total += (b.Gaz || 0);
                total += (b.setrika || 0);
                total += (b.lain_lain || 0);
            }
            return total;
        }

        function getTransactionsThisMonth() {
            const currentMonth = getCurrentMonth();
            return transactions.filter(t => t.tglOrder && t.tglOrder.startsWith(currentMonth));
        }

        function getDueTransactions() {
            const today = getTodayDate();
            return transactions.filter(t => t.tglSelesai === today);
        }

        function getMonthlyStats() {
            const monthlyTx = getTransactionsThisMonth();
            let totalKg = 0,
                totalOmzet = 0,
                totalLunas = 0;
            monthlyTx.forEach(tx => {
                const kgTotal = tx.detailJasa.reduce((sum, j) => sum + (j.kg || 0), 0);
                totalKg += kgTotal;
                totalOmzet += tx.totalHarga;
                if (tx.status === "Lunas") totalLunas += tx.totalHarga;
            });
            return { totalKg, totalOmzet, totalLunas };
        }

        const formatRupiah = (angka) => {
            if (angka === undefined || angka === null) return 'Rp 0';
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 })
                .format(angka);
        };

        function calculateTglSelesai(tglOrder, tempoHari) {
            if (!tglOrder) return "";
            const date = new Date(tglOrder);
            date.setDate(date.getDate() + tempoHari);
            return date.toISOString().slice(0, 10);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ============================================================
        // 4. FUNGSI NOMOR NOTA OTOMATIS
        // ============================================================
        function generateNoNota() {
            if (transactions.length === 0) return "6500";

            let maxNum = 0;
            for (const t of transactions) {
                const num = parseInt(t.noNota);
                if (!isNaN(num) && num > maxNum) {
                    maxNum = num;
                }
            }
            return String(maxNum + 1);
        }

        // ============================================================
        // 5. SIMPAN & LOAD DATA - PAKAI INDEXEDDB (localForage)
        // ============================================================
        async function saveData() {
            try {
                await localforage.setItem("bestie_laundry_db", transactions);
            } catch (e) {
                console.error("Gagal simpan transaksi ke IndexedDB:", e);
            }
        }

        async function saveBelanja() {
            try {
                await localforage.setItem("bestie_belanja_db", daftarBelanja);
            } catch (e) {
                console.error("Gagal simpan belanja ke IndexedDB:", e);
            }
        }

        async function saveSettings() {
            try {
                await localforage.setItem("bestie_settings", appSettings);
                updateHeaderUI();
            } catch (e) {
                console.error("Gagal simpan settings ke IndexedDB:", e);
            }
        }

        // ============================================================
        // 6. LOAD DATA - PAKAI INDEXEDDB + MIGRASI DARI localStorage
        // ============================================================
        async function loadData() {
            try {
                // Coba ambil dari IndexedDB dulu
                let storedTx = await localforage.getItem("bestie_laundry_db");
                let storedBelanja = await localforage.getItem("bestie_belanja_db");
                let storedSettings = await localforage.getItem("bestie_settings");

                // Jika tidak ada di IndexedDB, coba migrasi dari localStorage
                if (!storedTx) {
                    const legacyTx = localStorage.getItem("bestie_laundry_db");
                    if (legacyTx) {
                        storedTx = JSON.parse(legacyTx);
                        await localforage.setItem("bestie_laundry_db", storedTx);
                        localStorage.removeItem("bestie_laundry_db");
                        console.log("✅ Data transaksi dimigrasi dari localStorage ke IndexedDB");
                    }
                }

                if (!storedBelanja) {
                    const legacyBel = localStorage.getItem("bestie_belanja_db");
                    if (legacyBel) {
                        storedBelanja = JSON.parse(legacyBel);
                        await localforage.setItem("bestie_belanja_db", storedBelanja);
                        localStorage.removeItem("bestie_belanja_db");
                        console.log("✅ Data belanja dimigrasi dari localStorage ke IndexedDB");
                    }
                }

                if (!storedSettings) {
                    const legacySettings = localStorage.getItem("bestie_settings");
                    if (legacySettings) {
                        storedSettings = JSON.parse(legacySettings);
                        await localforage.setItem("bestie_settings", storedSettings);
                        localStorage.removeItem("bestie_settings");
                        console.log("✅ Settings dimigrasi dari localStorage ke IndexedDB");
                    }
                }

                transactions = storedTx || [];
                daftarBelanja = storedBelanja || [];
                if (storedSettings) {
                    appSettings = { ...appSettings, ...storedSettings };
                }

                updateHeaderUI();

            } catch (e) {
                console.error("Error loading data from IndexedDB:", e);
                // Fallback ke localStorage jika gagal
                try {
                    const fallbackTx = localStorage.getItem("bestie_laundry_db");
                    if (fallbackTx) transactions = JSON.parse(fallbackTx);
                    const fallbackBel = localStorage.getItem("bestie_belanja_db");
                    if (fallbackBel) daftarBelanja = JSON.parse(fallbackBel);
                    const fallbackSettings = localStorage.getItem("bestie_settings");
                    if (fallbackSettings) appSettings = { ...appSettings, ...JSON.parse(fallbackSettings) };
                } catch (e2) {
                    console.error("Fallback localStorage juga gagal:", e2);
                }
            }
        }

        function updateHeaderUI() {
            const titleEl = document.getElementById("headerTitle");
            const taglineEl = document.getElementById("headerTagline");
            const footerEl = document.getElementById("appFooter");

            if (titleEl) titleEl.textContent = appSettings.namaLaundry || "BESTIE LAUNDRY";
            if (taglineEl) taglineEl.textContent = appSettings.tagline || "✨ Manajemen Transaksi & Biaya ✨";
            if (footerEl) footerEl.textContent = appSettings.footerText || "© Bestie Laundry Since 2019";
        }

        // ============================================================
        // 8. MODAL MESSAGE BOX
        // ============================================================
        function showModal(options = {}) {
            const {
                icon = '📂',
                title = 'Perhatian',
                subtitle = '',
                message = '',
                btnPrimaryText = 'OK',
                btnSecondaryText = 'Tutup',
                onPrimary = null,
                onSecondary = null
            } = options;

            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalSubtitle').textContent = subtitle;
            document.getElementById('modalMessage').innerHTML = message;

            const btnPrimary = document.getElementById('modalBtnPrimary');
            const btnSecondary = document.getElementById('modalBtnSecondary');

            btnPrimary.textContent = btnPrimaryText;
            btnSecondary.textContent = btnSecondaryText;

            btnPrimary.onclick = null;
            btnSecondary.onclick = null;

            btnPrimary.onclick = function() {
                closeModal();
                if (onPrimary && typeof onPrimary === 'function') {
                    setTimeout(onPrimary, 300);
                }
            };

            btnSecondary.onclick = function() {
                closeModal();
                if (onSecondary && typeof onSecondary === 'function') {
                    setTimeout(onSecondary, 300);
                }
            };

            playPingSound();

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ============================================================
        // 9. TOAST NOTIFICATION
        // ============================================================
        let toastTimeout;

        function showToast(message, type = 'info') {
            playPingSound();

            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'success') toast.classList.add('success');
            else if (type === 'error') toast.classList.add('error');
            else if (type === 'warning') toast.classList.add('warning');
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================================
        // 10. LOADING OVERLAY
        // ============================================================
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('show');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        // ============================================================
        // 11. NAVIGASI
        // ============================================================
        function navigateTo(page) {
            currentPage = page;
            renderApp();
        }

        // ============================================================
        // 12. FUNGSI GENERATE EXCEL - LANGSUNG DOWNLOAD KE FOLDER DOWNLOADS
        // ============================================================
        function generateExcelData() {
            let excelRows = [
                [appSettings.namaLaundry || 'BESTIE LAUNDRY - LAPORAN DATA'],
                [''],
                ['=== DATA TRANSAKSI ==='],
                ['No Nota', 'Nama Customer', 'Tanggal Order', 'Jam Masuk', 'Estimasi Selesai',
                    'Tempo (hari)', 'Total Harga', 'Bayar', 'Sisa', 'Status', 'Metode Bayar', 'Keterangan',
                    'Detail Jasa'
                ]
            ];

            const sortedTx = [...transactions].sort((a, b) => {
                const numA = parseInt(a.noNota) || 0;
                const numB = parseInt(b.noNota) || 0;
                return numA - numB;
            });

            sortedTx.forEach(tr => {
                const detail = tr.detailJasa.map(j =>
                    `${j.namaJasa} (${j.kg}Kg × ${formatRupiah(j.hargaPerKg)}) = ${formatRupiah(j.total)}`
                ).join('; ');
                excelRows.push([
                    tr.noNota,
                    tr.nama,
                    tr.tglOrder,
                    tr.timeMasuk || '-',
                    tr.tglSelesai || '-',
                    tr.tempoHari,
                    formatRupiah(tr.totalHarga),
                    formatRupiah(tr.bayar),
                    formatRupiah(tr.sisa),
                    tr.status,
                    tr.cashBank,
                    tr.keterangan,
                    detail
                ]);
            });

            excelRows.push([]);
            excelRows.push(['=== RINGKASAN BULAN INI ===']);
            const stats = getMonthlyStats();
            excelRows.push(['Total Omzet', formatRupiah(stats.totalOmzet)]);
            excelRows.push(['Total Berat', stats.totalKg.toFixed(2) + ' Kg']);
            excelRows.push(['Total Lunas', formatRupiah(stats.totalLunas)]);

            excelRows.push([]);
            excelRows.push(['=== DATA BELANJA BULAN INI ===']);
            excelRows.push(['Tanggal', 'Sabun Cuci', 'Plastik', 'Parfum', 'Karbol', 'Listrik', 'Gaz', 'Setrika',
                'Lain-lain', 'TOTAL'
            ]);

            const belanjaBulanIni = getBelanjaThisMonth();
            belanjaBulanIni.forEach(b => {
                const total = (b.sabun_cuci || 0) + (b.plastik || 0) + (b.parfum || 0) + (b.karbol || 0) + (b
                    .listrik || 0) + (b.Gaz || 0) + (b.setrika || 0) + (b.lain_lain || 0);
                excelRows.push([
                    b.tgl_belanja,
                    formatRupiah(b.sabun_cuci || 0),
                    formatRupiah(b.plastik || 0),
                    formatRupiah(b.parfum || 0),
                    formatRupiah(b.karbol || 0),
                    formatRupiah(b.listrik || 0),
                    formatRupiah(b.Gaz || 0),
                    formatRupiah(b.setrika || 0),
                    formatRupiah(b.lain_lain || 0),
                    formatRupiah(total)
                ]);
            });

            excelRows.push([]);
            excelRows.push(['TOTAL BIAYA BULAN INI', formatRupiah(getTotalBiayaBulanIni())]);
            excelRows.push(['OMZET BERSIH', formatRupiah(stats.totalOmzet - getTotalBiayaBulanIni())]);

            excelRows.push([]);
            excelRows.push(['Dibuat pada:', new Date().toLocaleString('id-ID')]);
            excelRows.push([appSettings.footerText || 'Bestie Laundry © 2019']);

            return excelRows;
        }

        function generateExcelHTML(excelRows) {
            let html =
                '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
            html +=
                '<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Bestie Laundry</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->';
            html += '<style>';
            html += 'th { background-color: #1e5a7d; color: white; font-weight: bold; }';
            html += 'td { border: 1px solid #ccc; padding: 4px 8px; }';
            html += '.total { background-color: #f0f0f0; font-weight: bold; }';
            html +=
                '.header { background-color: #e28a05; color: white; font-size: 16pt; font-weight: bold; text-align: center; }';
            html += '.subheader { background-color: #ca5d19; color: white; font-weight: bold; }';
            html += '</style>';
            html += '</head><body>';
            html += '<table>';

            excelRows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    if (cell === undefined || cell === null) cell = '';
                    html += `<td>${cell}</td>`;
                });
                html += '</tr>';
            });

            html += '</table></body></html>';
            return html;
        }

        // ============================================================
        // 13. BACKUP DATA KE EXCEL - DOWNLOAD KE FOLDER DOWNLOADS
        // ============================================================
        function backupDataToExcel() {
            if (transactions.length === 0 && daftarBelanja.length === 0) {
                showToast('❌ Tidak ada data untuk diekspor!', 'error');
                return;
            }
            showLoading();

            try {
                const excelRows = generateExcelData();
                const excelHtml = generateExcelHTML(excelRows);
                const fileName =
                    `${appSettings.namaLaundry || 'BestieLaundry'}_${new Date().toISOString().slice(0,10)}.xls`;

                const blob = new Blob(['\uFEFF' + excelHtml], {
                    type: 'application/vnd.ms-excel;charset=utf-8'
                });

                // ===== CARA DOWNLOAD YANG PASTI MASUK FOLDER DOWNLOADS =====
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;

                // Tambahkan atribut untuk memastikan download
                link.setAttribute('download', fileName);
                link.setAttribute('target', '_blank');

                document.body.appendChild(link);

                // Trigger download dengan sedikit delay
                setTimeout(() => {
                    link.click();
                    setTimeout(() => {
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        hideLoading();
                        showToast('✅ File berhasil disimpan di folder Downloads!', 'success');
                    }, 500);
                }, 100);

            } catch (error) {
                console.error('Backup Excel error:', error);
                hideLoading();
                showToast('❌ Gagal backup Excel: ' + error.message, 'error');
            }
        }

        // ============================================================
        // 14. BACKUP JSON - DOWNLOAD KE FOLDER DOWNLOADS
        // ============================================================
        function backupDataToJson() {
            if (transactions.length === 0 && daftarBelanja.length === 0) {
                showToast('❌ Tidak ada data untuk dibackup!', 'error');
                return;
            }
            showLoading();

            try {
                const data = {
                    transactions: transactions,
                    daftarBelanja: daftarBelanja,
                    settings: appSettings,
                    backupDate: new Date().toISOString(),
                    version: "1.0"
                };

                const jsonString = JSON.stringify(data, null, 2);
                const fileName =
                    `${appSettings.namaLaundry || 'BestieLaundry'}_Backup_${new Date().toISOString().slice(0,10)}.json`;

                const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                link.setAttribute('download', fileName);
                link.setAttribute('target', '_blank');

                document.body.appendChild(link);

                setTimeout(() => {
                    link.click();
                    setTimeout(() => {
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        hideLoading();
                        showToast('✅ File JSON berhasil disimpan di folder Downloads!', 'success');
                    }, 500);
                }, 100);

            } catch (error) {
                console.error('Backup JSON error:', error);
                hideLoading();
                showToast('❌ Gagal backup JSON: ' + error.message, 'error');
            }
        }

        // ============================================================
        // 15. RESTORE DATA DARI FILE
        // ============================================================
        function restoreDataFromFile(file) {
            if (!file) return;
            if (file.size === 0) {
                showToast('❌ File kosong (0 KB)!', 'error');
                return;
            }
            if (!file.name.toLowerCase().endsWith('.json')) {
                showToast('❌ Hanya file JSON yang didukung untuk restore!', 'error');
                return;
            }
            showLoading();
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const data = JSON.parse(content);
                    if (data.transactions && data.daftarBelanja) {
                        if (confirm(
                                `⚠️ Akan mengganti semua data saat ini!\n\nData backup: ${data.backupDate || 'unknown'}\nTransaksi: ${data.transactions.length}\nBelanja: ${data.daftarBelanja.length}\n\nLanjutkan?`
                                )) {
                            transactions = data.transactions;
                            daftarBelanja = data.daftarBelanja;
                            if (data.settings) {
                                appSettings = { ...appSettings, ...data.settings };
                                saveSettings();
                            }
                            saveData();
                            saveBelanja();
                            hideLoading();
                            showToast('✅ Data berhasil dipulihkan!', 'success');
                            renderApp();
                        } else {
                            hideLoading();
                        }
                    } else {
                        hideLoading();
                        showToast('❌ Format file backup tidak valid!', 'error');
                    }
                } catch (error) {
                    console.error('Parse error:', error);
                    hideLoading();
                    showToast('❌ Gagal membaca file: ' + error.message, 'error');
                }
            };
            reader.onerror = function() {
                hideLoading();
                showToast('❌ Gagal membaca file', 'error');
            };
            reader.readAsText(file);
        }

        // ============================================================
        // 16. RESET ALL DATA
        // ============================================================
        function resetAllData() {
            if (confirm("⚠️ PERINGATAN: Anda akan menghapus SEMUA data!\n\nTransaksi: " + transactions.length +
                    " nota\nData Belanja: " + daftarBelanja.length + "\n\nYakin ingin melanjutkan?")) {
                if (confirm("🔄 Konfirmasi terakhir: Hapus semua data permanent?")) {
                    transactions = [];
                    daftarBelanja = [];
                    localforage.removeItem("bestie_laundry_db");
                    localforage.removeItem("bestie_belanja_db");
                    showToast('✅ Semua data berhasil dihapus!', 'success');
                    renderApp();
                }
            }
        }

        // ============================================================
        // 17. STATE APLIKASI
        // ============================================================
        let currentPage = "utama";
        let selectedTransaction = null;

        const MAX_JASA = 3;
        let orderJasaItems = [
            { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 },
            { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 },
            { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 }
        ];
        let orderForm = {
            noNota: "",
            nama: "",
            tempoHari: 3,
            tglOrder: new Date().toISOString().slice(0, 10),
            cashBank: "Cash",
            keterangan: ""
        };

        // ============================================================
        // 18. RENDER UTAMA
        // ============================================================
        function renderApp() {
            const root = document.getElementById("appRoot");
            if (!root) return;

            const isDatabaseEmpty = transactions.length === 0 && daftarBelanja.length === 0;

            if (isDatabaseEmpty && currentPage !== 'manage' && currentPage !== 'settings') {
                setTimeout(() => {
                    showModal({
                        icon: '📂',
                        title: 'Database Kosong',
                        subtitle: 'Belum ada data tersimpan',
                        message: 'Silakan <strong>restore</strong> dari file backup JSON di menu <strong>Maintenance</strong> atau <strong>input</strong> data baru.',
                        btnPrimaryText: '🗄️ Buka Maintenance',
                        btnSecondaryText: '✖️ Tutup',
                        onPrimary: function() {
                            navigateTo('manage');
                        },
                        onSecondary: function() {}
                    });
                }, 500);
            }

            switch (currentPage) {
                case "utama":
                    root.innerHTML = renderMenuUtama();
                    attachMenuEvents();
                    break;
                case "order":
                    if (!orderForm.noNota) {
                        orderForm.noNota = generateNoNota();
                    }
                    root.innerHTML = renderOrderMasuk();
                    attachOrderEvents();
                    break;
                case "bayar":
                    root.innerHTML = renderBayar();
                    attachBayarEvents();
                    break;
                case "lihat":
                    root.innerHTML = renderLihatTransaksi();
                    attachLihatEvents();
                    break;
                case "biaya":
                    root.innerHTML = renderBiayaOperasional();
                    attachBiayaEvents();
                    break;
                case "kirim":
                    root.innerHTML = renderKirimDataExcel();
                    attachKirimEvents();
                    break;
                case "edit":
                    root.innerHTML = renderEditView();
                    attachEditEvents();
                    break;
                case "manage":
                    root.innerHTML = renderManageDatabase();
                    attachManageEvents();
                    break;
                case "jatuh-tempo":
                    root.innerHTML = renderJatuhTempo();
                    attachJatuhTempoEvents();
                    break;
                case "settings":
                    root.innerHTML = renderSettings();
                    attachSettingsEvents();
                    break;
                default:
                    root.innerHTML = renderMenuUtama();
                    attachMenuEvents();
            }
        root.scrollTop = 0;  // langsung ke layar paling atas
        
        }

        // ============================================================
        // 19. RENDER MENU UTAMA
        // ============================================================
        function renderMenuUtama() {
            const stats = getMonthlyStats();
            const totalBiaya = getTotalBiayaBulanIni();
            const omzetBersih = stats.totalOmzet - totalBiaya;
            const dueCount = getDueTransactions().length;
            const isDatabaseEmpty = transactions.length === 0 && daftarBelanja.length === 0;

            return `
                    <div class="menu-grid">
                        <div class="menu-card" data-page="order"><div class="menu-icon">🏬</div><h6>Input Order</h6></div>
                        <div class="menu-card" data-page="bayar"><div class="menu-icon">💰</div><h6>Bayar</h6></div>
                        <div class="menu-card" data-page="lihat"><div class="menu-icon">👀</div><h6>Lihat data</h6></div>
                        <div class="menu-card ${dueCount > 0 ? 'due-alert' : ''}" data-page="jatuh-tempo">
                            <div class="menu-icon">⏰</div>
                            <h6>Jatuh Tempo</h6>
                            ${dueCount > 0 ? `<span class="badge-due">${dueCount}</span>` : ''}
                        </div>
                        <div class="menu-card" data-page="biaya"><div class="menu-icon">🧺</div><h6>Biaya Masuk</h6></div>
                        <div class="menu-card" data-page="kirim"><div class="menu-icon">📊</div><h6>Ekspor Data</h6></div>
                        <div class="menu-card" data-page="edit"><div class="menu-icon">✏️</div><h6>Edit data</h6></div>
                        <div class="menu-card" data-page="manage"><div class="menu-icon">🗄️</div><h6>Maintenance</h6></div>
                    </div>
                    ${isDatabaseEmpty ? `
                    <div class="panel" style="border: 2px dashed #f59e0b; background: #fef9e7; text-align:center; padding:25px 20px;">
                        <div style="font-size:3rem; margin-bottom:10px;">📂</div>
                        <h3 style="color:#92400e; margin-bottom:6px;">Database Kosong</h3>
                        <p style="color:#78350f; font-size:0.9rem; margin-bottom:12px;">
                            Belum ada data tersimpan. Silakan restore dari file backup JSON atau input data baru.
                        </p>
                        <button onclick="navigateTo('manage')" style="
                            background: #f59e0b; 
                            border: none; 
                            color: white; 
                            padding: 10px 30px; 
                            border-radius: 40px; 
                            font-weight: 600; 
                            font-size: 0.85rem; 
                            cursor: pointer;
                            width: auto;
                            margin: 0 auto;
                            display: inline-block;
                        ">🗄️ Buka Maintenance</button>
                    </div>
                    ` : `
                    <div class="panel">
                        <div class="panel-title">📊 RINGKASAN BULAN INI</div>
                        <div class="stat-card">
                            <div class="info-row"><span class="label">📦 Total Berat (Kg) :</span><span class="value">${stats.totalKg.toFixed(2)} Kg</span></div>
                            <div class="info-row"><span class="label">💰 Total Omzet :</span><span class="value">${formatRupiah(stats.totalOmzet)}</span></div>
                            <div class="info-row"><span class="label">✅ Total Lunas :</span><span class="value">${formatRupiah(stats.totalLunas)}</span></div>
                            <div class="info-row"><span class="label">📉 Total Biaya :</span><span class="value" style="color:#b91c1c;">${formatRupiah(totalBiaya)}</span></div>
                            <div class="info-row"><span class="label">📈 Omzet Bersih :</span><span class="value" style="color:#0f5c3f;">${formatRupiah(omzetBersih)}</span></div>
                        </div>
                        <div class="info-row"><span class="label">📅 Periode :</span><span class="value">${getCurrentMonth().replace('-', ' / ')}</span></div>
                        <div class="info-row"><span class="label">🧾 Jumlah Transaksi :</span><span class="value">${getTransactionsThisMonth().length} nota</span></div>
                        <div class="info-row"><span class="label">📋 Total Transaksi :</span><span class="value">${transactions.length} nota</span></div>
                        ${dueCount > 0 ? `<div class="info-row"><span class="label" style="color:#dc2626;">⏰ Jatuh Tempo Hari Ini :</span><span class="value" style="color:#dc2626;font-weight:700;">${dueCount} nota</span></div>` : ''}
                    </div>
                    `}
                `;
        }

        function attachMenuEvents() {
            document.querySelectorAll(".menu-card").forEach(card => {
                card.addEventListener("click", () => {
                    const page = card.dataset.page;
                    if (page === "order") {
                        orderJasaItems = [
                            { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 },
                            { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 },
                            { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 }
                        ];
                        orderForm = {
                            noNota: "",
                            nama: "",
                            tempoHari: 3,
                            tglOrder: new Date().toISOString().slice(0, 10),
                            cashBank: "Cash",
                            keterangan: ""
                        };
                    }
                    if (page === "edit") {
                        selectedTransaction = null;
                    }
                    navigateTo(page);
                });
            });
        }

        // ============================================================
        // 20. RENDER ORDER MASUK
        // ============================================================
        function renderOrderMasuk() {
            let rowsHtml = '';
            for (let i = 0; i < MAX_JASA; i++) {
                const item = orderJasaItems[i];
                rowsHtml += `<tr data-row="${i}">
                        <td><input type="text" class="jasa-nama" data-idx="${i}" value="${escapeHtml(item.namaJasa)}" placeholder="Jasa"></td>
                        <td><input type="number" step="0.1" class="jasa-kg" data-idx="${i}" value="${item.kg}" placeholder="Kg"></td>
                        <td><input type="number" step="1000" class="jasa-harga" data-idx="${i}" value="${item.hargaPerKg}" placeholder="Harga/Kg"></td>
                        <td class="subtotal-cell" id="subtotal-${i}">${formatRupiah(item.total)}</td>
                    </tr>`;
            }
            const grandTotal = recalcTotalFromItems();
            const tglSelesaiPreview = orderForm.tglOrder ? calculateTglSelesai(orderForm.tglOrder, orderForm.tempoHari) :
            "";
            const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit',
            second: '2-digit' });
            return `
                    <div class="panel">
                       <div class="panel-title">📝 ORDER MASUK</div>
                        <div class="input-group">                             
                            <input type="text" id="noNota" value="${escapeHtml(orderForm.noNota)}"</div>
                            <div class="small-note" style="margin-top:4px;color:#1e5a7d;"></div>
                        </div>
                        <div class="input-group"><input type="text" placeholder="Nama konsumen" id="namaCustomer" value="${escapeHtml(orderForm.nama)}"></div>
                        <div class="input-group"><input type="date" id="tglOrder" value="${orderForm.tglOrder}"></div>
                        <div class="input-group"><input type="number" id="tempoHari" value="${orderForm.tempoHari}"></div>
                        <div class="detail-card">Estimasi Selesai ---> <small id="estimasiPreview">${tglSelesaiPreview}</small></div>
                        <div class="detail-card">Jam Masuk order ----> <small>${nowTime}</small></div>
                        <table class="jasa-table"><thead><tr><th>Jenis Jasa</th><th>Kg</th><th>Rp/Kg</th><th>Subtotal</th></tr></thead>
                        <tbody id="jasaTableBody">${rowsHtml}</tbody></table>
                        <div class="total-bold">Total----------> : <span id="grandTotalDisplay">${formatRupiah(grandTotal)}</span></div>
                        <div class="input-group">  
                           <select id="cashBank"> 
                                <option value="Cash" ${orderForm.cashBank==="Cash"?"selected":""}>Cash</option> 
                                <option value="Bank" ${orderForm.cashBank==="Bank"?"selected":""}>Bank</option>
                           </select>
                        </div>
                        <div class="input-group"><input type="text" placeholder="Keterangan lain" id="keteranganOrder" value="${escapeHtml(orderForm.keterangan)}"></div>
                        <button id="simpanOrderBtn">💾 SIMPAN</button>
                        <button class="secondary" id="backToMenuBtn">↩️ Kembali</button>
                    </div>
                `;
        }

        function recalcTotalFromItems() {
            let grand = 0;
            for (let i = 0; i < orderJasaItems.length; i++) {
                const item = orderJasaItems[i];
                const kgVal = parseFloat(item.kg) || 0;
                const hargaVal = parseFloat(item.hargaPerKg) || 0;
                const totalItem = kgVal * hargaVal;
                item.total = totalItem;
                grand += totalItem;
            }
            return grand;
        }

        function attachOrderEvents() {
            const tglInput = document.getElementById("tglOrder");
            const tempoInput = document.getElementById("tempoHari");
            const estimasiSpan = document.getElementById("estimasiPreview");
            const updateEstimasi = () => {
                if (tglInput && tempoInput && estimasiSpan) {
                    estimasiSpan.innerText = calculateTglSelesai(tglInput.value, parseInt(tempoInput.value) || 0);
                }
            };
            if (tglInput) tglInput.addEventListener("change", updateEstimasi);
            if (tempoInput) tempoInput.addEventListener("input", updateEstimasi);

            function refreshAllTotals() {
                let grand = 0;
                for (let i = 0; i < MAX_JASA; i++) {
                    const kg = document.querySelector(`.jasa-kg[data-idx="${i}"]`);
                    const harga = document.querySelector(`.jasa-harga[data-idx="${i}"]`);
                    const nama = document.querySelector(`.jasa-nama[data-idx="${i}"]`);
                    let kgVal = parseFloat(kg?.value) || 0;
                    let hargaVal = parseFloat(harga?.value) || 0;
                    let totalItem = kgVal * hargaVal;
                    const subtotalEl = document.getElementById(`subtotal-${i}`);
                    if (subtotalEl) subtotalEl.innerText = formatRupiah(totalItem);
                    if (orderJasaItems[i]) {
                        orderJasaItems[i].kg = kgVal;
                        orderJasaItems[i].hargaPerKg = hargaVal;
                        orderJasaItems[i].total = totalItem;
                        if (nama) orderJasaItems[i].namaJasa = nama.value;
                    }
                    grand += totalItem;
                }
                const grandEl = document.getElementById("grandTotalDisplay");
                if (grandEl) grandEl.innerText = formatRupiah(grand);
            }

            for (let i = 0; i < MAX_JASA; i++) {
                document.querySelector(`.jasa-kg[data-idx="${i}"]`)?.addEventListener("input", refreshAllTotals);
                document.querySelector(`.jasa-harga[data-idx="${i}"]`)?.addEventListener("input", refreshAllTotals);
                document.querySelector(`.jasa-nama[data-idx="${i}"]`)?.addEventListener("change", refreshAllTotals);
            }

            document.getElementById("simpanOrderBtn")?.addEventListener("click", () => {
                let noNota = document.getElementById("noNota").value.trim();
                const nama = document.getElementById("namaCustomer").value.trim();
                const tglOrder = document.getElementById("tglOrder").value;
                const tempoHari = parseInt(document.getElementById("tempoHari").value) || 0;
                const cashBank = document.getElementById("cashBank").value;
                const keterangan = document.getElementById("keteranganOrder").value;

                if (!nama || !tglOrder) { showToast("Lengkapi data!", "error"); return; }

                if (!noNota) {
                    noNota = generateNoNota();
                }

                if (transactions.some(t => t.noNota === noNota)) {
                    showToast("No Nota sudah ada! Gunakan nomor lain.", "error");
                    return;
                }

                let detailJasaFinal = [];
                for (let i = 0; i < MAX_JASA; i++) {
                    const item = orderJasaItems[i];
                    if (item.kg > 0 && item.hargaPerKg > 0 && item.namaJasa.trim() !== "")
                        detailJasaFinal.push({ namaJasa: item.namaJasa, kg: item.kg, hargaPerKg: item.hargaPerKg,
                            total: item.kg * item.hargaPerKg });
                }
                if (detailJasaFinal.length === 0) { showToast("Minimal 1 layanan valid", "error"); return; }

                const totalHitung = detailJasaFinal.reduce((s, j) => s + j.total, 0);
                const timeMasuk = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit',
                    second: '2-digit' });
                const tglSelesai = calculateTglSelesai(tglOrder, tempoHari);
                const statusAwal = keterangan.toLowerCase().includes("lunas") ? "Lunas" : "Belum Lunas";
                const bayarAwal = statusAwal === "Lunas" ? totalHitung : 0;

                transactions.unshift({
                    id: "INV-" + Date.now(),
                    noNota,
                    nama,
                    tempoHari,
                    tglOrder,
                    timeMasuk,
                    tglSelesai,
                    detailJasa: detailJasaFinal,
                    totalHarga: totalHitung,
                    bayar: bayarAwal,
                    sisa: totalHitung - bayarAwal,
                    status: statusAwal,
                    cashBank,
                    keterangan
                });
                saveData();
                showToast(`✅ Order ${noNota} sukses`, 'success');
               
               // Reset form untuk input baru, tapi tetap di halaman order
                orderForm.noNota = "";  // biar generate otomatis nomor baru
                orderForm.nama = "";
                orderForm.keterangan = "";
                orderJasaItems = [
                    { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 },
                    { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 },
                    { namaJasa: "", kg: 0, hargaPerKg: 0, total: 0 }
                ];

                renderApp(); // tetap di halaman order dengan form kosong
            });

            document.getElementById("backToMenuBtn")?.addEventListener("click", () => navigateTo("utama"));
        }

        // ============================================================
        // 21. RENDER BAYAR
        // ============================================================
        function renderBayar() {
            const belumLunas = transactions.filter(t => t.sisa > 0);

            if (belumLunas.length === 0) {
                return `<div class="panel"><div class="panel-title">💰 BAYAR</div><p>✅ Semua lunas</p><button class="secondary" id="backFromBayar">↩️ Kembali</button></div>`;
            }

            let list = `<div class="panel-title">💰 Pilih Nota Bayar</div>
                    <div class="small-note" style="margin-bottom:2px;">📋 Total ${belumLunas.length} nota belum lunas</div>
                    <div class="bayar-list-container">`;

            const sortedBelumLunas = [...belumLunas].sort((a, b) => {
                const numA = parseInt(a.noNota) || 0;
                const numB = parseInt(b.noNota) || 0;
                return numA - numB;
            });

            sortedBelumLunas.forEach(tr => {
                list += `<div class="detail-card" style="margin-bottom:4px;">
                        <div><small>${tr.noNota}</small> - ${tr.nama}</div>
                        <div>Total: ${formatRupiah(tr.totalHarga)} | Sisa: ${formatRupiah(tr.sisa)}</div>
                        <button class="btn-bayar-nota" data-nota="${tr.noNota}">Bayar</button>
                    </div>`;
            });

            list += `</div>
                    <button class="secondary" id="backFromBayarList">↩️ Kembali</button>
                </div>`;

            return `<div class="panel">${list}</div>`;
        }

        function attachBayarEvents() {
            document.querySelectorAll(".btn-bayar-nota").forEach(btn => {
                btn.addEventListener("click", () => {
                    const nota = btn.getAttribute("data-nota");
                    const tr = transactions.find(t => t.noNota === nota);
                    if (tr) {
                        let bayar = parseFloat(prompt(`Bayar ${tr.noNota}, sisa: ${formatRupiah(tr.sisa)}`, tr
                        .sisa));
                        if (isNaN(bayar) || bayar <= 0) { showToast("Nominal salah", "error"); return; }
                        if (bayar > tr.sisa) { showToast("Melebihi sisa", "error"); return; }
                        const metode = confirm("Cash? (OK=Cash, Cancel=Bank)") ? "Cash" : "Bank";
                        tr.bayar += bayar;
                        tr.sisa -= bayar;
                        tr.status = tr.sisa <= 0 ? "Lunas" : "Belum Lunas";
                        tr.keterangan = tr.sisa <= 0 ? "Lunas" : `Sisa ${formatRupiah(tr.sisa)}`;
                        tr.cashBank = metode;
                        saveData();
                        showToast(`✅ Pembayaran sukses. Sisa: ${formatRupiah(tr.sisa)}`, 'success');
                        navigateTo("utama");
                    }
                });
            });
            document.getElementById("backFromBayar")?.addEventListener("click", () => navigateTo("utama"));
            document.getElementById("backFromBayarList")?.addEventListener("click", () => navigateTo("utama"));
        }

        // ============================================================
        // 22. RENDER LIHAT TRANSAKSI
        // ============================================================
        function renderLihatTransaksi() {
            let rows = '';
            const sortedTx = [...transactions].sort((a, b) => {
                const numA = parseInt(a.noNota) || 0;
                const numB = parseInt(b.noNota) || 0;
                return numA - numB;
            });

            const displayData = sortedTx.slice(0, 5000);

            displayData.forEach(t => {
                const kgTotal = t.detailJasa.reduce((s, j) => s + (j.kg || 0), 0);
                rows += `<tr>
                        <td>${escapeHtml(t.noNota)}</td>
                        <td>${escapeHtml(t.nama)}</td>
                        <td>${kgTotal.toFixed(2)} Kg</td>
                        <td class="text-right">${formatRupiah(t.totalHarga)}</td>
                        <td>${t.status}</td>
                        <td>${t.tglOrder}</td>
                        <td>${t.timeMasuk || '-'}</td>
                        <td>${t.tglSelesai || '-'}</td>
                    </tr>`;
            });

            if (transactions.length === 0) {
                rows = '<tr><td colspan="8" style="text-align:center;">Kosong</td></tr>';
            }

            const totalData = transactions.length;

            return `<div class="panel">
        
                    <div class="panel-title">📋 TOTAL TRANSAKSI (${totalData})</div>        
                    <div class="small-note" style="margin-bottom:8px;">⬇️ Scroll untuk melihat lebih banyak | Diurutkan berdasarkan No Nota</div>
                    <div class="scrollable-table-container"> 
                        <table class="transaction-table">
                            <thead>
                                <tr><th>No Nota</th><th>Nama</th><th>Kg</th><th>Total</th><th>Status</th><th>Tgl Order</th><th>Jam Masuk</th><th>Selesai</th></tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                    ${totalData > 5000 ? `<div class="small-note" style="text-align:center;color:#1e5a7d;margin-top:4px;">📌 Menampilkan 5000 data dengan No Nota terkecil dari ${totalData} transaksi</div>` : ''}
                    <button class="secondary" id="backFromLihat">↩️ Kembali</button>
                </div>`;
        }

        function attachLihatEvents() {
            document.getElementById("backFromLihat")?.addEventListener("click", () => navigateTo("utama"));
        }

        // ============================================================
        // 23. RENDER JATUH TEMPO
        // ============================================================
        // ============================================================
// [UBAH] FUNGSI RENDER JATUH TEMPO - Tambah detail no nota, nama, tagihan
// ============================================================
function renderJatuhTempo() {
    const dueTransactions = getDueTransactions();
    const today = getTodayDate();

    let dueHtml = '';
    if (dueTransactions.length === 0) {
        dueHtml = `
            <div class="no-due">
                <span class="icon">🎉</span>
                <p>Tidak ada transaksi yang jatuh tempo hari ini</p>

        function attachEditEvents() {
            document.querySelectorAll(".transaction-item").forEach(item => {
                item.addEventListener("click", function() {
                    const nota = this.getAttribute("data-nota");
                    const tx = transactions.find(t => t.noNota === nota);
                    if (tx) {
                        selectedTransaction = tx;
                        renderApp();
                    }
                });
            });

            document.getElementById("editSearchBtn")?.addEventListener("click", function() {
                const searchVal = document.getElementById("editSearchInput").value.trim().toUpperCase();
                const resultDiv = document.getElementById("editSearchResult");
                if (!searchVal) { resultDiv.innerHTML = '<p style="color:#94a3b8;">Masukkan No Nota atau Nama</p>'; return; }
                const found = transactions.filter(t =>
                    t.noNota.toUpperCase().includes(searchVal) ||
                    t.nama.toUpperCase().includes(searchVal)
                );
                if (found.length === 0) { resultDiv.innerHTML = '<p style="color:#b91c1c;">❌ Tidak ditemukan</p>'; return; }

                const sortedFound = [...found].sort((a, b) => {
                    const numA = parseInt(a.noNota) || 0;
                    const numB = parseInt(b.noNota) || 0;
                    return numA - numB;
                });

                let html = '<div style="margin-top:8px;max-height:300px;overflow-y:auto;">';
                sortedFound.forEach(t => {
                    const statusClass = t.status === "Lunas" ? "status-lunas" : "status-belum";
                    html += `
                            <div class="transaction-item" data-nota="${t.noNota}" style="border-left:4px solid #f59e0b;">
                                <div><div class="nota-info">📄 No. ${t.noNota}</div><div class="nota-detail">${escapeHtml(t.nama)} • ${formatRupiah(t.totalHarga)}</div></div>
                                <div><span class="status-badge ${statusClass}">${t.status || "Belum Lunas"}</span></div>
                            </div>
                        `;
                });
                html += '</div>';
                resultDiv.innerHTML = html;
                document.querySelectorAll("#editSearchResult .transaction-item").forEach(el => {
                    el.addEventListener("click", function() {
                        const nota = this.getAttribute("data-nota");
                        const tx = transactions.find(t => t.noNota === nota);
                        if (tx) { selectedTransaction = tx;
                            renderApp(); }
                    });
                });
            });

            document.getElementById("editSearchInput")?.addEventListener("keypress", function(e) {
                if (e.key === "Enter") document.getElementById("editSearchBtn").click();
            });

            const tglInput = document.getElementById("editTglOrder");
            const tempoInput = document.getElementById("editTempoHari");
            const estimasiSpan = document.getElementById("editEstimasiPreview");

            function updateEstimasi() {
                if (tglInput && tempoInput && estimasiSpan) {
                    estimasiSpan.innerText = calculateTglSelesai(tglInput.value, parseInt(tempoInput.value) || 0);
                }
            }
            if (tglInput) tglInput.addEventListener("change", updateEstimasi);
            if (tempoInput) tempoInput.addEventListener("input", updateEstimasi);

            function recalcEditTotals() {
                let grand = 0;
                for (let i = 0; i < 3; i++) {
                    const kgInput = document.querySelector(`.edit-jasa-kg[data-idx="${i}"]`);
                    const hargaInput = document.querySelector(`.edit-jasa-harga[data-idx="${i}"]`);
                    const subtotalSpan = document.getElementById(`edit-subtotal-${i}`);
                    let kgVal = parseFloat(kgInput?.value) || 0;
                    let hargaVal = parseFloat(hargaInput?.value) || 0;
                    let totalItem = kgVal * hargaVal;
                    if (subtotalSpan) subtotalSpan.innerText = formatRupiah(totalItem);
                    grand += totalItem;
                }
                const grandSpan = document.getElementById("editGrandTotal");
                if (grandSpan) grandSpan.innerText = formatRupiah(grand);
                const bayarInput = document.getElementById("editBayar");
                const sisaSpan = document.getElementById("editSisaDisplay");
                if (bayarInput && sisaSpan) {
                    const bayar = parseFloat(bayarInput.value) || 0;
                    sisaSpan.innerText = formatRupiah(grand - bayar);
                }
            }

            document.querySelectorAll(".edit-jasa-kg, .edit-jasa-harga, .edit-jasa-nama").forEach(input => {
                input?.addEventListener("input", recalcEditTotals);
            });
            document.getElementById("editBayar")?.addEventListener("input", recalcEditTotals);

            document.getElementById("saveEditBtn")?.addEventListener("click", function() {
                if (!selectedTransaction) { showToast("Tidak ada data dipilih!", "error"); return; }
                const noNota = selectedTransaction.noNota;
                const nama = document.getElementById("editNama").value.trim();
                const tglOrder = document.getElementById("editTglOrder").value;
                const timeMasuk = document.getElementById("editTimeMasuk").value || "12:00:00";
                const tempoHari = parseInt(document.getElementById("editTempoHari").value) || 0;
                const cashBank = document.getElementById("editCashBank").value;
                const bayar = parseFloat(document.getElementById("editBayar").value) || 0;
                const keterangan = document.getElementById("editKeterangan").value.trim();
                if (!nama || !tglOrder) { showToast("Nama dan Tanggal Order harus diisi!", "error"); return; }

                let detailJasa = [];
                for (let i = 0; i < 3; i++) {
                    const namaJasa = document.querySelector(`.edit-jasa-nama[data-idx="${i}"]`)?.value?.trim() || "";
                    const kg = parseFloat(document.querySelector(`.edit-jasa-kg[data-idx="${i}"]`)?.value) || 0;
                    const hargaPerKg = parseFloat(document.querySelector(`.edit-jasa-harga[data-idx="${i}"]`)?.value) ||
                    0;
                    if (namaJasa && kg > 0 && hargaPerKg > 0) {
                        detailJasa.push({ namaJasa, kg, hargaPerKg, total: kg * hargaPerKg });
                    }
                }
                if (detailJasa.length === 0) { showToast("Minimal 1 jasa dengan kg dan harga > 0!", "error"); return; }
                const totalHarga = detailJasa.reduce((sum, j) => sum + j.total, 0);
                const sisa = totalHarga - bayar;
                const status = sisa <= 0 ? "Lunas" : "Belum Lunas";
                const tglSelesai = calculateTglSelesai(tglOrder, tempoHari);

                const index = transactions.findIndex(t => t.noNota === noNota);
                if (index === -1) { showToast("Data tidak ditemukan!", "error"); return; }
                transactions[index] = {
                    ...transactions[index],
                    nama,
                    tglOrder,
                    timeMasuk,
                    tempoHari,
                    tglSelesai,
                    detailJasa,
                    totalHarga,
                    bayar,
                    sisa,
                    status,
                    cashBank,
                    keterangan: keterangan || (status === "Lunas" ? "Lunas" : `Sisa ${formatRupiah(sisa)}`)
                };
                saveData();
                showToast(`✅ Data ${noNota} berhasil diupdate!`, 'success');
                selectedTransaction = null;
                renderApp();
            });

            document.getElementById("deleteEditBtn")?.addEventListener("click", function() {
                if (!selectedTransaction) return;
                if (confirm(`Yakin hapus data No Nota ${selectedTransaction.noNota}?`)) {
                    transactions = transactions.filter(t => t.noNota !== selectedTransaction.noNota);
                    saveData();
                    showToast("Data berhasil dihapus!", 'success');
                    selectedTransaction = null;
                    renderApp();
                }
            });

            document.getElementById("cancelEditBtn")?.addEventListener("click", function() {
                selectedTransaction = null;
                renderApp();
            });

            document.getElementById("backFromEditBtn")?.addEventListener("click", () => navigateTo("utama"));
        }

        // ============================================================
        // 27. RENDER SETTINGS
        // ============================================================
        function renderSettings() {
            return `
                    <div class="panel">
                        <div class="panel-title">⚙️ PENGATURAN</div>
                        <div class="small-note" style="margin-bottom:12px;">Ubah nama laundry dan tagline sesuai keinginan Anda.</div>
                        
                        <div class="settings-preview" id="settingsPreview">
                            <h2 id="settingsPreviewTitle">${escapeHtml(appSettings.namaLaundry || "BESTIE LAUNDRY")}</h2>
                            <p id="settingsPreviewTagline">${escapeHtml(appSettings.tagline || "✨ Manajemen Transaksi & Biaya ✨")}</p>
                        </div>

                        <div class="settings-field">
                            <label for="settingsNamaLaundry">🏢 Nama Laundry</label>
                            <input type="text" id="settingsNamaLaundry" value="${escapeHtml(appSettings.namaLaundry || '')}" placeholder="Contoh: BESTIE LAUNDRY">
                            <div class="hint">Nama yang akan tampil di header aplikasi</div>
                        </div>

                        <div class="settings-field">
                            <label for="settingsTagline">📝 Tagline</label>
                            <input type="text" id="settingsTagline" value="${escapeHtml(appSettings.tagline || '')}" placeholder="Contoh: ✨ Manajemen Transaksi & Biaya ✨">
